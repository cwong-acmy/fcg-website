    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem("theme");
                if (savedTheme === "dark" || savedTheme === "light") {
                    document.documentElement.setAttribute("data-theme", savedTheme);
                    document.documentElement.classList.toggle("dark", savedTheme === "dark");
                }
            } catch (error) {}
        })();
    </script>
