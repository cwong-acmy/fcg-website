<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>FCG Deck · Closing / CTA</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080805; --fg:#f7f7f2; --muted:#a1a1aa; --soft:#71717a;
    --accent:#f97316; --accent-strong:#ea580c; --border:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  em{color:var(--accent);font-style:normal;font-weight:500;}
  .slide{position:relative;width:1920px;height:1080px;padding:120px;display:flex;flex-direction:column;}
  .glow{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:1000px;height:1000px;border-radius:50%;
    background:radial-gradient(circle,rgba(249,115,22,0.14),transparent 60%);filter:blur(10px);pointer-events:none;}
  .logo{height:32px;color:var(--fg);position:relative;}
  .logo svg{height:100%;width:auto;display:block;}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:40px;position:relative;}
  .prompt{font-size:20px;font-weight:500;letter-spacing:0.04em;color:var(--soft);display:flex;align-items:center;gap:14px;}
  .prompt .arrow{color:var(--accent);font-weight:600;}
  h1{font-size:104px;font-weight:600;line-height:1.02;letter-spacing:-0.03em;max-width:1400px;}
  .cta-pair{display:flex;gap:18px;margin-top:8px;}
  .btn{border-radius:999px;font-size:19px;font-weight:500;padding:18px 38px;border:1px solid transparent;}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 14px 34px rgba(249,115,22,0.22);}
  .btn-secondary{background:rgba(255,255,255,0.04);border-color:var(--border);color:#fff;}
  .footer{display:flex;align-items:center;justify-content:space-between;position:relative;}
  .footer .tag{font-size:14px;letter-spacing:0.18em;text-transform:uppercase;color:var(--soft);}
  .footer a{color:var(--muted);text-decoration:none;font-size:15px;letter-spacing:0.04em;}
</style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="logo" aria-label="FCG Group">

      </svg>
    </div>
    <div class="body">
      <div class="prompt"><span class="arrow">&gt;</span> Start a conversation</div>
      <h1>Get connected to the layer underneath.</h1>
      <div class="cta-pair">
        <button class="btn btn-primary">Book a demo</button>
        <button class="btn btn-secondary">Request sandbox access</button>
      </div>
    </div>
    <div class="footer">
      <span class="tag">Connect · Operate · Experience</span>
      <a href="https://www.fusionconnectgroup.com">fusionconnectgroup.com</a>
    </div>
  </div>
</body>
</html>
