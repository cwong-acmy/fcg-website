<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>FCG Deck · Section divider</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080805; --fg:#f7f7f2; --muted:#a1a1aa; --soft:#71717a;
    --accent:#f97316; --border:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  em{color:var(--accent);font-style:normal;font-weight:500;}
  .slide{position:relative;width:1920px;height:1080px;padding:120px;display:flex;flex-direction:column;justify-content:center;}
  .ghost{position:absolute;right:96px;bottom:-80px;font-size:560px;font-weight:600;line-height:0.8;
    color:rgba(255,255,255,0.035);letter-spacing:-0.04em;pointer-events:none;user-select:none;}
  .eyebrow{font-size:16px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--soft);margin-bottom:40px;display:flex;align-items:center;gap:18px;}
  .eyebrow .bar{width:54px;height:2px;background:var(--accent);}
  .eyebrow .ix{color:var(--accent);}
  h1{font-size:104px;font-weight:600;line-height:1.02;letter-spacing:-0.03em;max-width:1400px;position:relative;}
  .clarifier{margin-top:40px;font-size:26px;font-weight:300;line-height:1.5;color:var(--muted);max-width:1040px;position:relative;}
</style>
</head>
<body>
  <div class="slide">
    <div class="ghost">02</div>
    <div class="eyebrow"><span class="bar"></span>Section · Connection <span class="ix">02</span></div>
    <h1>Open connections, <em>not</em> locked platforms.</h1>
    <p class="clarifier">Asia-native. Globally connected. The supply layer the players that matter are already on.</p>
  </div>
</body>
</html>
