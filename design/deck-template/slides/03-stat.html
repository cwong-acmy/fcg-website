<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>FCG Deck · Stat / proof</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080805; --fg:#f7f7f2; --muted:#a1a1aa; --soft:#71717a;
    --accent:#f97316; --border:rgba(255,255,255,0.10);
    --card:linear-gradient(180deg,rgba(255,255,255,0.065),rgba(255,255,255,0.025));
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  em{color:var(--accent);font-style:normal;font-weight:500;}
  .slide{width:1920px;height:1080px;padding:104px 120px;display:flex;flex-direction:column;}
  .eyebrow{font-size:15px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--soft);}
  .eyebrow .ix{color:var(--accent);}
  h2{font-size:72px;font-weight:600;line-height:1.04;letter-spacing:-0.025em;margin-top:24px;max-width:1300px;}
  .clarifier{margin-top:24px;font-size:24px;font-weight:300;color:var(--muted);max-width:1100px;}
  .grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:26px;padding:44px 40px;display:flex;flex-direction:column;gap:18px;}
  .num{font-size:84px;font-weight:600;line-height:0.95;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
  .num em{font-weight:600;}
  .cap{font-size:14px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--soft);}
</style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Proof · Scale · <span class="ix">03</span></div>
    <h2>Scale that earns the claim.</h2>
    <p class="clarifier">4.3M+ hotels, 24.9M+ room types, every major airline — connected through one open layer.</p>
    <div class="grid">
      <div class="stat"><div class="num">4.3<em>M+</em></div><div class="cap">Hotels connected</div></div>
      <div class="stat"><div class="num">24.9<em>M+</em></div><div class="cap">Room types</div></div>
      <div class="stat"><div class="num">300<em>+</em></div><div class="cap">Brands · already connected</div></div>
      <div class="stat"><div class="num">99.9<em>%</em></div><div class="cap">Network uptime</div></div>
    </div>
  </div>
</body>
</html>
