<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-theme", t);
                    document.documentElement.classList.toggle("dark", t === "dark");
                }
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG template · Final CTA band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../template-shell.css">
</head>
<body>
    <button class="tpl-theme-toggle" data-theme-toggle aria-label="Toggle theme"><span data-theme-label>Light</span></button>

    <div class="tpl-label">
        <strong>15 · Final CTA band</strong>
        <span>page types: all</span>
        <span class="nuitee-ref">nuitee ref: / · /connect · /about-us (closing band)</span>
    </div>

    <!-- STRUCTURE: centered closing band over accent glow. Pill, mono-prefixed
         headline, clarifier, 2 CTAs. Tight stack, copy carries the close. -->
    <section class="tpl-section tpl-center">
        <div class="tpl-glow"></div>
        <div class="tpl-inner tpl-stack" style="align-items:center; gap:0;">
            <span class="tpl-pill reveal">
                <span class="dot"></span>
                <span class="slot">Get started</span>
            </span>

            <h2 class="tpl-h2 reveal" data-delay="1" style="margin-top:1.75rem;">
                <span class="tpl-mono">&gt;</span> <span class="slot">closing claim, sentence case, &le;8 words. One <em>accent span</em> max</span>
            </h2>

            <p class="tpl-clarifier reveal" data-delay="2">
                <span class="slot">one clarifier line, &le;20 words — system-described, no "you"</span>
            </p>

            <div class="tpl-actions reveal" data-delay="3">
                <a class="tpl-btn tpl-btn-primary" href="#"><span class="slot">Get connected</span> <span class="arr">&rarr;</span></a>
                <a class="tpl-btn tpl-btn-secondary" href="#"><span class="tpl-btn-icon">&lt;/&gt;</span> <span class="slot">View the docs</span></a>
            </div>
        </div>
    </section>

    <script src="../template-shell.js"></script>
</body>
</html>
