<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-theme", t);
                    document.documentElement.classList.toggle("dark", t === "dark");
                }
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG template · Statement band</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../template-shell.css">
</head>
<body>
    <button class="tpl-theme-toggle" data-theme-toggle aria-label="Toggle theme"><span data-theme-label>Light</span></button>

    <div class="tpl-label">
        <strong>09 · Statement band</strong>
        <span>page types: product detail, segment landing, about</span>
        <span class="nuitee-ref">nuitee ref: /connect (outcome bands)</span>
    </div>

    <!-- STRUCTURE: centered band, glow backdrop. Optional eyebrow + one big outcome
         claim (ONE accent phrase) + optional clarifier. Heavy whitespace, no cards, no CTA. -->
    <section class="tpl-section tpl-center">
        <div class="tpl-glow"></div>
        <div class="tpl-inner">
            <p class="tpl-eyebrow-dash reveal"><span class="slot">eyebrow · 1-2 words</span></p>

            <h2 class="tpl-h2 reveal" data-delay="1">
                <span class="slot">H2: outcome claim, sentence case, &le;8 words. One <em>accent phrase</em> max</span>
            </h2>

            <p class="tpl-clarifier reveal" data-delay="2">
                <span class="slot">one clarifier line, &le;20 words — system-described, no "you"</span>
            </p>
        </div>
    </section>

    <script src="../template-shell.js"></script>
</body>
</html>
