<!DOCTYPE html>
<!-- Template for blog/<slug>.html. Generated by tools/build-site.py from blog/posts.json; edit this file, not the generated pages. -->
<html lang="en" data-theme="light">
<head>
{{head_common}}
    <title>{{title}} | FCG Blog</title>
    <meta name="description" content="{{excerpt}}">
{{robots}}    <link rel="canonical" href="{{url}}">
    <link rel="alternate" type="application/rss+xml" title="FCG Blog" href="{{site}}/blog/feed.xml">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Fusion Connect Group">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{excerpt}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{image_url}}">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="bg-background text-foreground antialiased">
<!-- SHARED:NAV --><!-- /SHARED:NAV -->
<main>
    <article class="article">
        <div class="article-wrap">
            <nav class="crumbs" aria-label="Breadcrumb">
                <a href="../blog.html">Blog</a><span aria-hidden="true">/</span><a href="../blog.html?topic={{topic}}">{{topic_label}}</a>
            </nav>
            <h1 class="article-title">{{title}}</h1>
            <p class="article-dek">{{excerpt}}</p>
            <div class="article-byline">
                <span class="post-author"><span class="post-avatar" aria-hidden="true">{{initials}}</span><span>{{author}}<small>{{role}}</small></span></span>
                <p class="post-meta"><span>{{date_label}}</span><span>{{minutes}} min read</span></p>
            </div>
            <div class="article-hero post-media{{contain_class}}" style="background-image: url('../{{image}}');" aria-hidden="true"></div>
{{draft_note}}            <div class="prose">
{{body}}
            </div>
            <aside class="article-cta" aria-label="Related product">
                <h2>{{cta_title}}</h2>
                <p>{{cta_text}}</p>
                <a class="blog-btn" href="../{{cta_href}}">{{cta_label}}</a>
            </aside>
            <section class="article-end" aria-labelledby="related-heading">
                <div class="blog-strip-head">
                    <h2 class="blog-strip-title" id="related-heading">Keep reading</h2>
                    <a class="blog-strip-link" href="../blog.html">All posts</a>
                </div>
                <div class="blog-grid">
{{related}}
                </div>
            </section>
        </div>
    </article>
</main>
<!-- SHARED:FOOTER --><!-- /SHARED:FOOTER -->
</body>
</html>
