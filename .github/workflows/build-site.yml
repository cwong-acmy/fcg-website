# Rebuilds the generated HTML whenever a source changes (a Pages CMS save is just a commit),
# then commits the result back to the same branch. Commits made with GITHUB_TOKEN do not
# trigger workflows again, so this cannot loop. Pull requests only run the check.
name: Build site

on:
  push:
    branches: [codex/blog, codex/drafts, main]
    paths:
      - "blog/posts/**"
      - "blog/_post.html"
      - "_shell/**"
      - "assets/images/blog/**"
      - "tools/build-site.py"
      - "*.html"
  pull_request:
    paths:
      - "blog/**"
      - "_shell/**"
      - "tools/build-site.py"
      - "*.html"

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 tools/build-site.py --check
      - name: Build and commit (pushes)
        if: github.event_name == 'push'
        run: |
          python3 tools/build-site.py
          node --test tools/test-forms.js
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "fcg-site-build"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rebuild site pages"
            git pull --rebase
            python3 tools/build-site.py --check
            git push
          fi
